name: Release AVD LKMs

# Publishes one GitHub Release per upstream version: tag "<variant>-<version>",
# e.g. kernelsu-v3.3.1 or kernelsu-next-v3.4.2. avd-ksu.py consumes these releases.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: KernelSU project
        type: choice
        options: [kernelsu, kernelsu-next]
        default: kernelsu
      version:
        description: Upstream release tag (vX.Y.Z)
        required: true
      prerelease:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like v3.3.1"; exit 1; }

  build:
    needs: check
    uses: ./.github/workflows/build-lkm.yml
    with:
      variant: ${{ inputs.variant }}
      ref: ${{ inputs.version }}
      target: all

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets
        env:
          V: ${{ inputs.version }}
          VARIANT: ${{ inputs.variant }}
        run: |
          mkdir -p release
          # kernelsu.ko per target: <target>_<variant>-<version>_kernelsu.ko
          for d in artifacts/lkm-*/; do
            for ko in "$d"*_kernelsu.ko; do
              t=$(basename "$ko" _kernelsu.ko)
              cp "$ko" "release/${t}_${VARIANT}-${V}_kernelsu.ko"
            done
          done
          # host tools: ksud-<variant>-<version>-<triple>[.exe], ksuinit-x86_64-<variant>-<version>
          for f in artifacts/host-tools*/*; do
            n=$(basename "$f")
            case "$n" in
              ksud-*) cp "$f" "release/ksud-${VARIANT}-${V}-${n#ksud-}" ;;
              ksuinit-x86_64) cp "$f" "release/ksuinit-x86_64-${VARIANT}-${V}" ;;
            esac
          done
          cp .github/avd-targets.json avd-ksu.py release/
          n_ko=$(ls release/*_kernelsu.ko | wc -l)
          n_t=$(jq '.targets | length' .github/avd-targets.json)
          [ "$n_ko" = "$n_t" ] || { echo "::error::expected $n_t LKMs, got $n_ko"; exit 1; }
          ls release/ksud-*-x86_64-pc-windows-gnu.exe release/ksuinit-x86_64-* >/dev/null
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
          VARIANT: ${{ inputs.variant }}
        run: |
          case "$VARIANT" in
            kernelsu) UP=tiann/KernelSU; TOOLS="unmodified binaries from the upstream release [$UP@$V](https://github.com/$UP/releases/tag/$V), source" ;;
            kernelsu-next) UP=KernelSU-Next/KernelSU-Next; TOOLS="built unmodified from" ;;
          esac
          UP_SHA=$(gh api "repos/$UP/commits/$V" --jq .sha)
          REPO="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "${VARIANT} ${V} LKMs for stock Android Studio x86_64 AVDs, each built against the AVD kernel's exact source."
            echo
            echo "| Target | Kernel | \`kernel/common\` | Patches |"
            echo "| :--- | :--- | :--- | :--- |"
            jq -r --arg v "$VARIANT" '.targets[] | [.id, .label, .kernel_release, ((.patches[$v] // []) | join(" "))] | @tsv' \
              .github/avd-targets.json |
            while IFS=$'\t' read -r id label rel patches; do
              sha=$(sed -n 's/^COMMON_SHA=//p' "artifacts/lkm-$id/$id.env")
              [ -n "$sha" ] || { echo "::error::no COMMON_SHA for $id" >&2; exit 1; }
              links=""
              for p in $patches; do links+="${links:+, }[\`$p\`]($REPO/blob/$GITHUB_SHA/patches/$p)"; done
              echo "| $label | \`$rel\` | [\`${sha:0:12}\`](https://android.googlesource.com/kernel/common/+/$sha) | ${links:-none} |"
            done
            echo
            echo "Patch an AVD: \`python avd-ksu.py patch --avd <name> --variant ${VARIANT} --version ${V}\` (see README)."
            echo "Install the matching ${VARIANT} ${V} manager APK from the upstream release."
            echo
            echo "### Sources and licenses"
            echo
            echo "- \`*_kernelsu.ko\` (GPL-2.0-only): \`kernel/\` of [$UP@$V](https://github.com/$UP/tree/$UP_SHA) (\`${UP_SHA:0:12}\`) plus the patches listed above, built against the listed \`kernel/common\` commit with the AVD kernel's own config by [$GITHUB_REPOSITORY@${GITHUB_SHA:0:7}]($REPO/tree/$GITHUB_SHA)."
            echo "- \`ksud-*\`, \`ksuinit-x86_64-*\` (GPL-3.0-or-later): $TOOLS [$UP@$V](https://github.com/$UP/tree/$UP_SHA)."
            echo "- \`avd-ksu.py\`, \`avd-targets.json\`: Apache-2.0, from [$GITHUB_REPOSITORY@${GITHUB_SHA:0:7}]($REPO/tree/$GITHUB_SHA)."
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.variant }}-${{ inputs.version }}
        run: |
          flags=(); [ "${{ inputs.prerelease }}" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-publish: drop assets this run no longer produces (e.g. a removed or renamed
            # target), so nothing outside SHA256SUMS stays attached.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r n; do
              [ -e "release/$n" ] || { echo "delete stale asset $n"; gh release delete-asset "$TAG" "$n" --yes; }
            done
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md --prerelease="${{ inputs.prerelease }}"
          else
            gh release create "$TAG" release/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" "${flags[@]}"
          fi
